name: PLXYGROUND CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: test
          CORS_ORIGIN: "*"
        run: |
          node src/index.js &
          sleep 3

      - name: Run smoke tests
        working-directory: backend
        run: bash smoke-test.sh http://localhost:3011

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Export web build
        working-directory: frontend
        run: npx expo export --platform web

  admin:
    name: Admin Panel Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          test -f admin-panel/index.html && echo "✓ index.html exists"
          test -f admin-panel/js/app.js && echo "✓ app.js exists"
          test -f admin-panel/css/styles.css && echo "✓ styles.css exists"
