<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLXYGROUND Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>

  <!-- Login Page -->
  <div id="login-page" class="login-container">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:linear-gradient(135deg,#00f0ff,#7b2dff);border-radius:14px;margin-bottom:16px;box-shadow:0 0 24px rgba(0,240,255,0.3);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div style="font-size:26px;font-weight:800;letter-spacing:3px;color:#00f0ff;text-shadow:0 0 20px rgba(0,240,255,0.4);">PLXYGROUND</div>
        <div style="font-size:13px;color:#4a5070;margin-top:6px;font-weight:500;">Administration Console</div>
      </div>
      <h2 class="login-title">Welcome back</h2>
      <p class="login-subtitle">Sign in to manage the platform</p>
      <label class="form-label">Email address</label>
      <input type="email" id="login-email" class="form-input" placeholder="admin@plxyground.local" autocomplete="email">
      <label class="form-label">Password</label>
      <input type="password" id="login-password" class="form-input" placeholder="Enter your password" autocomplete="current-password">
      <div id="login-error" style="color:#ff3366;font-size:13px;margin-top:14px;display:none;font-weight:500;"></div>
      <button id="login-btn" class="btn btn-primary btn-full" style="margin-top:24px;padding:13px 20px;font-size:15px;" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-page" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;vertical-align:middle;opacity:0.7"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        PLXYGROUND
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-item active" data-page="queue" onclick="navigate('queue')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg></span> Queue</button>
        <button class="sidebar-item" data-page="content" onclick="navigate('content')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span> Content</button>
        <button class="sidebar-item" data-page="add-content" onclick="navigate('add-content')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span> Add Content</button>
        <button class="sidebar-item" data-page="users" onclick="navigate('users')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Users</button>
        <button class="sidebar-item" data-page="add-user" onclick="navigate('add-user')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg></span> Add User</button>
        <button class="sidebar-item" data-page="audit" onclick="navigate('audit')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></span> Audit Log</button>
        <button class="sidebar-item" data-page="analytics" onclick="navigate('analytics')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Analytics</button>
        <button class="sidebar-item" data-page="alerts" onclick="navigate('alerts')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span> Live Alerts</button>
        <button class="sidebar-item" data-page="security" onclick="navigate('security')"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span> Admin Security</button>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-item" onclick="handleSignOut()"><span class="sidebar-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="page-title">Queue</div>
        <div class="topbar-right">
          <input type="text" class="topbar-search" id="global-search" placeholder="Search anything…" oninput="handleGlobalSearch(this.value)">
          <button class="btn btn-ghost btn-sm" onclick="navigate('security')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Security</button>
        </div>
      </div>
      <div class="page-content" id="page-content"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
